<!DOCTYPE html>
<html lang="pt-bt">

<head>
    <meta charset="UTF-8">
    <title>Posicionamento CSS</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

                <a href="#">Multimarcas</a>

            </div>
        </div>
        <div class="barra-nav">
            <img class="logo-taco" src="assets/taco-logo.png" alt="Logo da loja Taco" width="90px">
            <div class="botoes-barra-nav">
                <nav>
                    <a href="#">Novidades</a>
                    <a href="#">Masculino</a>
                    <a href="#">Feminino</a>
                    <a href="#">Kids</a>
                    <a href="#">Jeans</a>
                    <a href="#">Calçados</a>

                </nav>
            </div>
            <div class="botoes-acao-nav">
                <div class="botao-perfil-carrinho">
                    <button type="button">
                        <img src="assets/usuario.png" alt="Icone do usuario" width="30px">
                    </button>                              
                    <button type="button">
                        <img src="assets/cart.png" alt="Carrinho de compras" width="30px">
                    </button>
                </div>
            </div>
        </div>

</html>
