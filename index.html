<!DOCTYPE html>
<html lang="pt-bt">

<head>
    <meta charset="UTF-8">
    <title>Posicionamento CSS</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="botoes-barra-superior">
        <a href="#">Multimarcas</a>
        <a href="#">Nossas lojas</a>
    </div>
    <header class="barra-superior">
        <img class="logo-taco" src="assets/taco-logo.png" alt="Logo da loja Taco" width="90px">
        <nav class="barra-nav">
            <a href="#">Novidades</a>
            <a href="#">Masculino</a>
            <a href="#">Feminino</a>
            <a href="#">Kids</a>
            <a href="#">Jeans</a>
            <a href="#">Calçados</a>
            <a href="#">Acessórios</a>
        </nav>
        <div class="botoes-acoes">
            <button type="button">
                <img src="assets/usuario.png" alt="Icone do usuario" width="30px">
            </button>
            <button type="button">
                <img src="assets/cart.png" alt="Carrinho de compras" width="30px">
            </button>
        </div>
    </header>
    <main>
        <div>
            <img src="assets/banner-taco.png" alt="Banner black friday da taco" width="100%">
        </div>
        <section>
            <div class="titulo-produtos-destaque">
                <p><b>PRODUTOS </b><span class="em-destaque">EM DESTAQUE</span></p>
            </div>
            <div id="produtos-destaque">
                <div class="produto-destacado">
                    <img src="assets/calca-chino-flx.png" alt="Calça chino Flex" width="400px">
                    <p>Calça Chino Flex</p>
                    <p>R$ <b>79,90</b></p>
                </div>
                <div class="produto-destacado">
                    <img src="assets/calca-color-chino-khaki.png" alt="Calça Color Chino Khaki" width="400px">
                    <p>Calça Color Chino Khaki</p>
                    <p>R$ <b>89,90</b></p>
                </div>
                <div class="produto-destacado">
                    <img src="assets/regata-basica-azul.png" alt="Regata Basica Azul" width="400px">
                    <p>Regata Básica Azul</p>
                    <p>R$ <b>69,90</b></p>
                </div>
                <div class="produto-destacado">
                    <img src="assets/regata-basica-telha.png" alt="Regata basica telha" width="400">
                    <p>Regata Básica Telha</p>
                    <P>R$ <b>69,90</b></P>
                </div>
            </div>
        </section>
        <div class="botao-suporte">
            <img src="assets/whatsapp.png" alt="Icone de chamada do whatsapp" width="100%">
        </div>
    </main>
</body>
</html>
